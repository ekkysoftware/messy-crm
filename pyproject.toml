[project]
name = "messy-crm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ekky Armandi", email = "ekky@softwareseni.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=4.2,<6.0",
    "django-vite>=3.2.0",
    "gunicorn>=26.2.0",
    "inertia-django>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "python-decouple>=3.8",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "ruff>=0.17.1",
]

[tool.ruff]
# Generated, vendored, and planning files are not ours to lint.
extend-exclude = [
    "crm/migrations",
    "frontend",
    "openspec",
    "staticfiles",
    ".venv",
]

[tool.ruff.lint.per-file-ignores]
# Django models carry mutable class attributes by design (choices, Meta.ordering).
"crm/models.py" = ["RUF012"]

[tool.bandit]
# Generated and vendored code only; waive findings per line with `# nosec B<id>`.
exclude_dirs = [
    "crm/migrations",
    "frontend",
    "staticfiles",
    ".venv",
]
