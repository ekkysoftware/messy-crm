[project]
name = "messy-crm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ekky Armandi", email = "ekky@softwareseni.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=4.2,<6.0",
    "django-vite>=3.2.0",
    "gunicorn>=26.2.0",
    "inertia-django>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "python-decouple>=3.8",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage[toml]>=7.17.0",
    "python-semantic-release>=10.7.0",
    "ruff>=0.17.1",
]

[tool.ruff]
# Generated, vendored, and planning files are not ours to lint.
extend-exclude = [
    "crm/migrations",
    "frontend",
    "openspec",
    "staticfiles",
    ".venv",
]

[tool.ruff.lint.per-file-ignores]
# Django models carry mutable class attributes by design (choices, Meta.ordering).
"crm/models.py" = ["RUF012"]

[tool.coverage.run]
# Measure the application code, not the tests that exercise it.
source = ["crm", "messycrm"]
branch = true
omit = [
    "crm/migrations/*",
    "crm/tests/*",
    "messycrm/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The suite covers the app almost completely; keep regressions from slipping in.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
# Generated and vendored code only; waive findings per line with `# nosec B<id>`.
exclude_dirs = [
    "crm/migrations",
    "frontend",
    "staticfiles",
    ".venv",
]

[tool.semantic_release]
# Only `main` releases: the version is cut after the production deploy of the
# commit that just landed, never from the integration branch.
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
# The project starts at 0.1.0; a `feat:` on main moves it to 0.2.0 rather than
# jumping to 1.0.0 before the first stable release.
allow_zero_version = true
# `[skip ci]` keeps the bump commit from starting another CI run (and therefore
# another deploy); GitHub honours it for `push` events.
commit_message = "chore(release): {version} [skip ci]"
commit_author = "semantic-release <semantic-release@users.noreply.github.com>"

[tool.semantic_release.branches.main]
match = "^main$"

[tool.semantic_release.remote]
# Passed by release.yml; the PAT is needed because the default GITHUB_TOKEN
# cannot push a tag or bump commit to a protected main.
token = { env = "GH_TOKEN" }
