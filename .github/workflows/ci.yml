name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.3"
  UV_VERSION: "0.13.0"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Lint workflow definitions
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
          ./actionlint -color

  lint:
    name: lint
    needs: [workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Security analysis
        run: uv run bandit -c pyproject.toml -r crm messycrm -x crm/migrations -ll

  test:
    name: test
    needs: [workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: uv run python manage.py check

      - name: Tests
        run: uv run python manage.py test

  build:
    name: build
    needs: [workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      - name: Type check
        run: bun run typecheck

      - name: Bundle
        run: bun run build

  deploy:
    name: deploy
    needs: [lint, test, build]
    if: github.event_name != 'pull_request' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Staging
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: dev
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Resolve image tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Read the tag currently deployed
        run: |
          previous=$(./scripts/ssm-run.sh "$INSTANCE_ID" "$AWS_REGION" "read deployed tag" \
            'sed -n s/^IMAGE_TAG=//p /opt/messycrm/host.env' | jq -r .stdout | tr -d '\r\n')
          echo "previous tag: ${previous:-none}"
          echo "PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push
        run: |
          # The repository is immutable and the tag is commit-derived, so a re-run
          # of the same commit reuses the image that commit already produced.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" \
              --query 'imageDetails[0].imageDigest' --output text)
            echo "reusing ${ECR_REPOSITORY}:${TAG} ${digest}"
          else
            docker buildx build --platform linux/amd64 --push -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}" .
            digest=$(docker buildx imagetools inspect "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}" --format '{{.Manifest.Digest}}')
            echo "pushed ${ECR_REPOSITORY}:${TAG} ${digest}"
          fi
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Deploy to the host
        run: ./scripts/ssm-run.sh "$INSTANCE_ID" "$AWS_REGION" "deploy ${TAG}" "sudo -n /opt/messycrm/deploy.sh ${TAG}"

      - name: Smoke test
        run: |
          for attempt in $(seq 1 12); do
            if body=$(curl -fsS --max-time 10 "${APP_URL}/"); then
              echo "$body" | grep -q '<div id="app"' && { echo "dashboard served from ${APP_URL}"; exit 0; }
            fi
            echo "attempt ${attempt}: not ready"
            sleep 5
          done
          echo "::error::${APP_URL}/ did not serve the dashboard after deploy"
          exit 1

      - name: Roll back
        if: failure() && env.PREVIOUS_TAG != '' && env.PREVIOUS_TAG != 'bootstrap' && env.PREVIOUS_TAG != env.TAG
        run: |
          echo "::error::rolling back to ${PREVIOUS_TAG}"
          ./scripts/ssm-run.sh "$INSTANCE_ID" "$AWS_REGION" "rollback to ${PREVIOUS_TAG}" \
            "sudo -n /opt/messycrm/deploy.sh ${PREVIOUS_TAG}"
          curl -fsS --retry 6 --retry-delay 5 "${APP_URL}/" > /dev/null && echo "rolled back and serving"
          exit 1

      - name: Summary
        if: success()
        run: |
          {
            echo "## deploy"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`${TARGET_ENV}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image | \`${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}\` |"
            echo "| Digest | \`${IMAGE_DIGEST}\` |"
            echo "| URL | ${APP_URL}/ |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary on failure
        if: failure()
        run: |
          {
            echo "## deploy failed"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}\` |"
            echo "| Rolled back to | \`${PREVIOUS_TAG:-nothing}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
