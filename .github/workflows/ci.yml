name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.3"
  UV_VERSION: "0.13.0"
  ACTIONLINT_VERSION: "1.7.12"
  NODE_VERSION: "22"
  PI_VERSION: "1.4.0"

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Lint workflow definitions
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
          ./actionlint -color

  lint:
    name: lint
    needs: [workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Security analysis
        run: uv run bandit -c pyproject.toml -r crm core -x crm/migrations -ll

  test:
    name: test
    needs: [workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: uv run python manage.py check

      - name: Tests
        run: uv run coverage run manage.py test

      - name: Coverage
        run: uv run coverage report

  build:
    name: build
    needs: [workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      - name: Type check
        run: bun run typecheck

      - name: Bundle
        run: bun run build

  deepseek-code-review:
    name: deepseek-code-review
    needs: [lint, test, build]
    if: >-
      (github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name != 'pull_request' && github.ref_name != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Collect the diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE=$(git rev-parse "${HEAD}~1" 2>/dev/null || git rev-list --max-parents=0 "$HEAD")
          fi
          git diff "$BASE...$HEAD" > /tmp/change.diff
          if [[ ! -s /tmp/change.diff ]]; then
            echo "::notice::nothing to review for ${HEAD}"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          if [[ "$(wc -c < /tmp/change.diff)" -gt 150000 ]]; then
            echo "::warning::diff exceeds 150 KB and was truncated for review"
          fi
          head -c 150000 /tmp/change.diff > /tmp/review-input.diff

      - uses: actions/setup-node@v5
        if: env.SKIP != '1'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pi
        if: env.SKIP != '1'
        run: npm install -g --ignore-scripts "@earendil-works/pi-coding-agent@${PI_VERSION}"

      - name: Review
        if: env.SKIP != '1'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          prompt='You are reviewing a diff for messy-crm: a Django + DRF backend and a React/Inertia frontend.

          The diff is prepended to this prompt. Judge only the changed lines; use read, grep, and find to check the
          surrounding code. Read AGENTS.md, .pi/skills/django-reviewer/SKILL.md, and .pi/skills/cdrf-expert/SKILL.md
          first and follow their guidance.

          Report real defects only: bugs, security problems, unsafe migrations, DRF or ORM anti-patterns, wrong
          HTTP semantics, and new behavior without tests. Ignore formatting and style that ruff already enforces.

          Output a "## Findings" heading, then one bullet per finding as
          "- [blocking|non-blocking] path:line - what is wrong - how to fix it".
          Use "- none" when nothing is wrong.
          End with exactly one final line, either "VERDICT: pass" or "VERDICT: block".
          Reserve VERDICT: block for correctness, security, or data-loss risk; everything else is non-blocking.'

          pi --print --model deepseek/deepseek-flash --tools read,grep,find,ls \
            "$prompt" < /tmp/review-input.diff > /tmp/review.md
          echo "--- review ---"
          cat /tmp/review.md

      - name: Report
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '<!-- deepseek-code-review -->'; cat /tmp/review.md; } > /tmp/comment.md
          cat /tmp/comment.md >> "$GITHUB_STEP_SUMMARY"

          number="${{ github.event.pull_request.number }}"
          if [[ -z "$number" ]]; then
            number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')
          fi
          if [[ -n "$number" ]]; then
            gh pr comment "$number" --body-file /tmp/comment.md
          fi

          verdict=$(grep -oE '^VERDICT: (pass|block)$' /tmp/review.md | tail -1 | awk '{print $2}')
          if [[ -z "$verdict" ]]; then
            echo "::warning::review produced no VERDICT line; not blocking"
          elif [[ "$verdict" == "block" ]]; then
            echo "::error::deepseek-code-review blocked this change"
            exit 1
          fi

  deploy-to-staging:
    name: Deploy to Staging
    needs: [deepseek-code-review]
    if: github.event_name != 'pull_request' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Staging
      url: http://15.232.41.25
    concurrency:
      group: deploy-to-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: dev
      ENVIRONMENT_NAME: Staging
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify the deployment environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A run outside the environment cannot assume the deploy role anyway; this
          # guard catches the silent failure mode where the environment name is
          # misspelled and GitHub runs the job without its protection rules.
          if ! gh api "repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT_NAME}" > /tmp/environment.json 2>/tmp/environment.err; then
            if grep -q 'HTTP 403' /tmp/environment.err; then
              echo "::warning::cannot inspect '${ENVIRONMENT_NAME}' with the workflow token; relying on the environment gate"
            else
              echo "::error::GitHub environment '${ENVIRONMENT_NAME}' does not exist; refusing to deploy without its protection rules"
              cat /tmp/environment.err
              exit 1
            fi
          elif [[ "$ENVIRONMENT_NAME" == "Production" ]]; then
            rules=$(jq '.protection_rules | length' /tmp/environment.json)
            if [[ "${rules:-0}" -eq 0 ]]; then
              echo "::error::GitHub environment 'Production' has no protection rules; refusing to deploy without approval"
              exit 1
            fi
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Resolve image tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Read the tag currently deployed
        run: |
          previous=$(./infra/scripts/ssm-run.sh "$INSTANCE_ID" "$AWS_REGION" "read deployed tag" \
            'sed -n s/^IMAGE_TAG=//p /opt/messycrm/host.env' | jq -r .stdout | tr -d '\r\n')
          echo "previous tag: ${previous:-none}"
          echo "PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push
        run: |
          # The repository is immutable and the tag is commit-derived, so a re-run
          # of the same commit reuses the image that commit already produced.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" \
              --query 'imageDetails[0].imageDigest' --output text)
            echo "reusing ${ECR_REPOSITORY}:${TAG} ${digest}"
          else
            docker buildx build --platform linux/amd64 --push -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}" .
            digest=$(docker buildx imagetools inspect "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}" --format '{{.Manifest.Digest}}')
            echo "pushed ${ECR_REPOSITORY}:${TAG} ${digest}"
          fi
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Deploy to the host
        run: ./infra/scripts/ssm-run.sh "$INSTANCE_ID" "$AWS_REGION" "deploy ${TAG}" "sudo -n /opt/messycrm/deploy.sh ${TAG}"

      - name: Smoke test
        run: |
          for attempt in $(seq 1 12); do
            if body=$(curl -fsS --max-time 10 "${APP_URL}/"); then
              echo "$body" | grep -q '<div id="app"' && { echo "dashboard served from ${APP_URL}"; exit 0; }
            fi
            echo "attempt ${attempt}: not ready"
            sleep 5
          done
          echo "::error::${APP_URL}/ did not serve the dashboard after deploy"
          exit 1

      - name: Roll back
        if: failure() && env.PREVIOUS_TAG != '' && env.PREVIOUS_TAG != 'bootstrap' && env.PREVIOUS_TAG != env.TAG
        run: |
          echo "::error::rolling back to ${PREVIOUS_TAG}"
          ./infra/scripts/ssm-run.sh "$INSTANCE_ID" "$AWS_REGION" "rollback to ${PREVIOUS_TAG}" \
            "sudo -n /opt/messycrm/deploy.sh ${PREVIOUS_TAG}"
          curl -fsS --retry 6 --retry-delay 5 "${APP_URL}/" > /dev/null && echo "rolled back and serving"
          exit 1

      - name: Summary
        if: success()
        run: |
          {
            echo "## deploy"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`${TARGET_ENV}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image | \`${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}\` |"
            echo "| Digest | \`${IMAGE_DIGEST}\` |"
            echo "| URL | ${APP_URL}/ |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary on failure
        if: failure()
        run: |
          {
            echo "## deploy failed"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}\` |"
            echo "| Rolled back to | \`${PREVIOUS_TAG:-nothing}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Promotion is independent of `deploy` (which is Staging-only): a skipped job
  # in `needs` would skip this one on main. The validated-artifact step below is
  # the real dependency, so a commit without a dev image is refused.
  deploy-to-prod:
    name: Deploy to Production
    needs: [lint, test, build]
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production
      url: http://15.232.150.14
    concurrency:
      group: deploy-to-prod
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      TARGET_ENV: prod
      ENVIRONMENT_NAME: Production
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      PROD_ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      SOURCE_ECR_REPOSITORY: ${{ vars.SOURCE_ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify the deployment environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A run outside the environment cannot assume the deploy role anyway; this
          # guard catches the silent failure mode where the environment name is
          # misspelled and GitHub runs the job without its protection rules.
          if ! gh api "repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT_NAME}" > /tmp/environment.json 2>/tmp/environment.err; then
            if grep -q 'HTTP 403' /tmp/environment.err; then
              echo "::warning::cannot inspect '${ENVIRONMENT_NAME}' with the workflow token; relying on the environment gate"
            else
              echo "::error::GitHub environment '${ENVIRONMENT_NAME}' does not exist; refusing to deploy without its protection rules"
              cat /tmp/environment.err
              exit 1
            fi
          elif [[ "$ENVIRONMENT_NAME" == "Production" ]]; then
            rules=$(jq '.protection_rules | length' /tmp/environment.json)
            if [[ "${rules:-0}" -eq 0 ]]; then
              echo "::error::GitHub environment 'Production' has no protection rules; refusing to deploy without approval"
              exit 1
            fi
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Resolve image tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          source_short="$short"

          # A pull request merged into main creates a new SHA that development
          # never built (merge, squash, and rebase all do this). Promote the
          # image built for the pull request's head instead, but keep
          # sha-<main short> as the prod tag so release.yml can still find it.
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].head.sha // empty')
          if [[ -n "$head_sha" ]]; then
            source_short="${head_sha::7}"
            echo "main commit came from a merged pull request; source artifact is sha-${source_short}"
          fi

          {
            echo "SHORT=${short}"
            echo "TAG=sha-${short}"
            echo "SOURCE_SHORT=${source_short}"
            echo "SOURCE_TAG=sha-${source_short}"
          } >> "$GITHUB_ENV"

      - name: Read the tag currently deployed
        run: |
          previous=$(./infra/scripts/ssm-run.sh "$INSTANCE_ID" "$AWS_REGION" "read deployed tag" \
            'sed -n s/^IMAGE_TAG=//p /opt/messycrm/host.env' | jq -r .stdout | tr -d '\r\n')
          echo "previous tag: ${previous:-none}"
          echo "PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Promote the validated digest
        run: |
          digest=$(aws ecr describe-images --repository-name "$SOURCE_ECR_REPOSITORY" \
            --image-ids imageTag="$SOURCE_TAG" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [[ -z "$digest" || "$digest" == "None" ]]; then
            echo "::error::no validated artifact: ${SOURCE_ECR_REPOSITORY}:${SOURCE_TAG} does not exist; refusing to promote"
            exit 1
          fi
          echo "validated digest: ${digest} from ${SOURCE_ECR_REPOSITORY}:${SOURCE_TAG}"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

          # The prod repository is immutable too, so a re-run reuses the tag it
          # already has; a different digest under the same commit tag is a bug.
          if existing=$(aws ecr describe-images --repository-name "$PROD_ECR_REPOSITORY" \
              --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null); then
            if [[ "$existing" != "$digest" ]]; then
              echo "::error::${PROD_ECR_REPOSITORY}:${TAG} already exists with digest ${existing}, not ${digest}"
              exit 1
            fi
            echo "reusing ${PROD_ECR_REPOSITORY}:${TAG} ${digest}"
            exit 0
          fi

          docker pull "${ECR_REGISTRY}/${SOURCE_ECR_REPOSITORY}@${digest}"
          docker tag "${ECR_REGISTRY}/${SOURCE_ECR_REPOSITORY}@${digest}" \
            "${ECR_REGISTRY}/${PROD_ECR_REPOSITORY}:${TAG}"
          docker push "${ECR_REGISTRY}/${PROD_ECR_REPOSITORY}:${TAG}"
          promoted=$(docker buildx imagetools inspect "${ECR_REGISTRY}/${PROD_ECR_REPOSITORY}:${TAG}" --format '{{.Manifest.Digest}}')
          if [[ "$promoted" != "$digest" ]]; then
            echo "::error::promotion changed the digest: dev ${digest}, prod ${promoted}"
            exit 1
          fi
          echo "promoted ${PROD_ECR_REPOSITORY}:${TAG} ${promoted}"

      - name: Deploy to the host
        run: ./infra/scripts/ssm-run.sh "$INSTANCE_ID" "$AWS_REGION" "deploy ${TAG}" "sudo -n /opt/messycrm/deploy.sh ${TAG}"

      - name: Smoke test
        run: |
          for attempt in $(seq 1 12); do
            if body=$(curl -fsS --max-time 10 "${APP_URL}/"); then
              echo "$body" | grep -q '<div id="app"' && { echo "dashboard served from ${APP_URL}"; exit 0; }
            fi
            echo "attempt ${attempt}: not ready"
            sleep 5
          done
          echo "::error::${APP_URL}/ did not serve the dashboard after deploy"
          exit 1

      - name: Roll back
        if: failure() && env.PREVIOUS_TAG != '' && env.PREVIOUS_TAG != 'bootstrap' && env.PREVIOUS_TAG != env.TAG
        run: |
          echo "::error::rolling back to ${PREVIOUS_TAG}"
          ./infra/scripts/ssm-run.sh "$INSTANCE_ID" "$AWS_REGION" "rollback to ${PREVIOUS_TAG}" \
            "sudo -n /opt/messycrm/deploy.sh ${PREVIOUS_TAG}"
          curl -fsS --retry 6 --retry-delay 5 "${APP_URL}/" > /dev/null && echo "rolled back and serving"
          exit 1

      - name: Summary
        if: success()
        run: |
          {
            echo "## deploy-prod"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`${TARGET_ENV}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Source | \`${SOURCE_ECR_REPOSITORY}:${SOURCE_TAG}\` |"
            echo "| Image | \`${ECR_REGISTRY}/${PROD_ECR_REPOSITORY}:${TAG}\` |"
            echo "| Digest | \`${IMAGE_DIGEST}\` |"
            echo "| URL | ${APP_URL}/ |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary on failure
        if: failure()
        run: |
          {
            echo "## deploy-prod failed"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${ECR_REGISTRY}/${PROD_ECR_REPOSITORY}:${TAG:-unknown}\` |"
            echo "| Rolled back to | \`${PREVIOUS_TAG:-nothing}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
