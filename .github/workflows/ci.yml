name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.3"
  UV_VERSION: "0.13.0"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Lint workflow definitions
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
          ./actionlint -color

  lint:
    name: lint
    needs: [workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Security analysis
        run: uv run bandit -c pyproject.toml -r crm messycrm -x crm/migrations -ll

  test:
    name: test
    needs: [workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: uv run python manage.py check

      - name: Tests
        run: uv run python manage.py test

  build:
    name: build
    needs: [workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      - name: Type check
        run: bun run typecheck

      - name: Bundle
        run: bun run build

  deploy:
    name: deploy
    needs: [lint, test, build]
    if: github.event_name != 'pull_request' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Staging
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: dev
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Resolve image tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Read the tag currently deployed
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "read deployed tag" \
            --parameters 'commands=sed -n s/^IMAGE_TAG=//p /opt/messycrm/host.env' \
            --query 'Command.CommandId' --output text)

          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 2 ;; *) break ;; esac
          done

          previous=$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text | tr -d '\r\n')
          echo "previous tag: ${previous:-none}"
          echo "PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}

      - name: Log in to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 --push -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}" .
          digest=$(docker buildx imagetools inspect "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}" --format '{{.Manifest.Digest}}')
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "pushed ${ECR_REPOSITORY}:${TAG} ${digest}"

      - name: Deploy to the host
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${TAG}" \
            --parameters "commands=sudo -n /opt/messycrm/deploy.sh ${TAG}" \
            --query 'Command.CommandId' --output text)

          status=Pending
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{status: Status, stdout: StandardOutputContent, stderr: StandardErrorContent}' --output json
          echo "deploy status: $status"
          [ "$status" = "Success" ] || exit 1
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}

      - name: Smoke test
        run: |
          for attempt in $(seq 1 12); do
            if body=$(curl -fsS --max-time 10 "${APP_URL}/"); then
              echo "$body" | grep -q '<div id="app"' && { echo "dashboard served from ${APP_URL}"; exit 0; }
            fi
            echo "attempt ${attempt}: not ready"
            sleep 5
          done
          echo "::error::${APP_URL}/ did not serve the dashboard after deploy"
          exit 1
        env:
          APP_URL: ${{ vars.APP_URL }}

      - name: Roll back
        if: failure() && env.PREVIOUS_TAG != '' && env.PREVIOUS_TAG != 'bootstrap' && env.PREVIOUS_TAG != env.TAG
        run: |
          echo "::error::rolling back to ${PREVIOUS_TAG}"
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "rollback to ${PREVIOUS_TAG}" \
            --parameters "commands=sudo -n /opt/messycrm/deploy.sh ${PREVIOUS_TAG}" \
            --query 'Command.CommandId' --output text)

          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          echo "rollback status: $status (tag ${PREVIOUS_TAG})"
          curl -fsS --retry 6 --retry-delay 5 "${{ vars.APP_URL }}/" > /dev/null && echo "rolled back and serving"
          exit 1
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}

      - name: Summary
        if: success()
        run: |
          {
            echo "## deploy"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`${TARGET_ENV}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image | \`${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}\` |"
            echo "| Digest | \`${IMAGE_DIGEST}\` |"
            echo "| URL | ${APP_URL}/ |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          APP_URL: ${{ vars.APP_URL }}

      - name: Summary on failure
        if: failure()
        run: |
          {
            echo "## deploy failed"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}\` |"
            echo "| Rolled back to | \`${PREVIOUS_TAG}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
