name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.3"
  UV_VERSION: "0.13.0"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Security analysis
        run: uv run bandit -c pyproject.toml -r crm messycrm -x crm/migrations -ll

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: uv run python manage.py check

      - name: Tests
        run: uv run python manage.py test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      - name: Type check
        run: bun run typecheck

      - name: Bundle
        run: bun run build

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Lint workflow definitions
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
          ./actionlint -color

  deploy:
    name: deploy
    needs: [lint, test, build, workflows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - name: Report intended deployment
        run: |
          {
            echo "## deploy (stub)"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`${TARGET_ENV}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image | \`${GITHUB_REPOSITORY}:sha-${GITHUB_SHA:0:7}\` |"
            echo
            echo "No AWS resources are provisioned yet, so nothing was built, pushed, or deployed."
          } >> "$GITHUB_STEP_SUMMARY"
